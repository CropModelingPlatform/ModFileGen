[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modfilegen"
dynamic = ["version"]
description = "Generate and run model input files for different crop models based on a standardized shared database"
readme = "README.rst"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Cyrille Ahmed Midingoyi", email = "cyrille_ahmed.midingoyi@cirad.fr"},
]
maintainers = [
    {name = "LIMA Team - Crop Modeling Platform"},
]
keywords = ["crop models", "DSSAT", "STICS", "APSIM", "agricultural modeling", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=1.5",
    "joblib>=1.0",
    "PyYAML>=6.0",
    # Imported at module level by the STICS v9 and DSSAT converters, which
    # log their resident memory. It was missing here, so a clean install
    # could not even import them.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Only modfilegen.utils.stics_txt_to_xml needs this, and it imports it
# lazily with an explicit message, so it stays out of the base install.
xlsx = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.0",
    # uv does not seed setuptools into a venv, and one test builds the
    # project metadata to check it survives a non-UTF-8 locale.
    "setuptools>=61",
    "pytest-cov",
    "pytest-mock",
    "openpyxl>=3.1",
    "flake8",
    "build",
    "twine",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/CropModelingPlatform/ModFileGen"
Documentation = "https://modfilegen.readthedocs.io"
Repository = "https://github.com/CropModelingPlatform/ModFileGen"
Issues = "https://github.com/CropModelingPlatform/ModFileGen/issues"

[project.scripts]
agriscale = "modfilegen.cli:main"
# The package name as a command too, since `pip install modfilegen` is what
# puts it there.
modfilegen = "modfilegen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "modfilegen.version.__version__"}

[tool.setuptools.package-data]
modfilegen = [
    "*.json", "*.xml", "*.ini", "*.shp", "*.yml",
    "config/outputs/*.yml",
    # The demo fixture and the plant files it refers to, so that
    # `agriscale selftest` works from a plain pip install with no
    # repository checkout. 1.1 MB of text in all.
    "data_fixtures/*/*.sql",
    "data_fixtures/*/*.csv",
    "data_fixtures/cultivars/stics/*.txt",
    "data_fixtures/cultivars/dssat/*",
    "data_fixtures/*.sha256",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # A test that returns instead of asserting still passes, so the warning
    # was hiding tests that checked nothing. Make it a hard error rather
    # than noise at the end of every run.
    "error::pytest.PytestReturnNotNoneWarning",
]
addopts = "--maxfail=2 -rf --cov=modfilegen --cov-report=term-missing"
